<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | MARO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style> body { font-family: 'Cairo', sans-serif; background: #0f172a; color: white; } </style>
</head>
<body class="p-6">

    <!-- تسجيل الدخول -->
    <div id="login-section" class="max-w-md mx-auto mt-20 bg-slate-800 p-8 rounded-2xl shadow-xl">
        <h2 class="text-2xl font-black mb-6 text-center text-cyan-400">تسجيل دخول الإدارة</h2>
        <input type="email" id="email" placeholder="البريد الإلكتروني" class="w-full mb-4 p-3 rounded-lg bg-slate-900 border border-slate-700 text-white outline-none focus:border-cyan-400">
        <input type="password" id="password" placeholder="كلمة المرور" class="w-full mb-6 p-3 rounded-lg bg-slate-900 border border-slate-700 text-white outline-none focus:border-cyan-400">
        <button onclick="login()" class="w-full bg-cyan-500 text-black font-bold py-3 rounded-lg hover:bg-cyan-400 transition">دخول</button>
        <p id="login-error" class="text-red-500 text-sm mt-4 text-center hidden"></p>
    </div>

    <!-- لوحة التحكم -->
    <div id="admin-section" class="hidden max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-8 border-b border-slate-700 pb-4">
            <h1 class="text-3xl font-black text-cyan-400">لوحة الإدارة</h1>
            <button onclick="logout()" class="bg-red-500 px-4 py-2 rounded-lg font-bold hover:bg-red-600">تسجيل خروج</button>
        </div>

        <!-- إضافة منتج -->
        <div class="bg-slate-800 p-6 rounded-2xl mb-8">
            <h2 class="text-xl font-bold mb-4">إضافة تطبيق / لعبة جديدة</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <select id="cat-id" class="p-3 rounded-lg bg-slate-900 border border-slate-700 text-white outline-none">
                    <option value="games">قسم الألعاب</option>
                    <option value="apps">قسم التطبيقات</option>
                    <option value="subs">الاشتراكات</option>
                </select>
                <input type="text" id="app-name" placeholder="اسم التطبيق (مثال: PUBG Mobile)" class="p-3 rounded-lg bg-slate-900 border border-slate-700 text-white outline-none">
                <input type="text" id="app-img" placeholder="لينك صورة التطبيق (URL)" class="p-3 rounded-lg bg-slate-900 border border-slate-700 text-white outline-none">
                <button onclick="addProduct()" class="bg-cyan-500 text-black font-bold py-3 rounded-lg hover:bg-cyan-400 transition">إضافة التطبيق</button>
            </div>
        </div>

        <!-- قائمة المنتجات -->
        <h2 class="text-xl font-bold mb-4">التطبيقات الحالية</h2>
        <div id="products-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ⚠️ ضع كود Firebase الخاص بك هنا
        const firebaseConfig = {
            apiKey: "AIzaSyAZucoNuZyKDoxfS7tboc3-ZttqONuw_vw",
            authDomain: "maro-store-4dc09.firebaseapp.com",
            projectId: "maro-store-4dc09",
            storageBucket: "maro-store-4dc09.firebasestorage.app",
            messagingSenderId: "55163169834",
            appId: "1:55163169834:web:48ba5eda57e23c41886753"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // تسجيل الدخول
        window.login = () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            signInWithEmailAndPassword(auth, email, password)
                .catch(err => {
                    const errEl = document.getElementById('login-error');
                    errEl.innerText = "خطأ: تأكد من الإيميل والباسورد";
                    errEl.classList.remove('hidden');
                });
        };

        // تسجيل الخروج
        window.logout = () => signOut(auth);

        // مراقبة حالة الدخول
        onAuthStateChanged(auth, user => {
            if (user) {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('admin-section').classList.remove('hidden');
                loadProducts();
            } else {
                document.getElementById('login-section').classList.remove('hidden');
                document.getElementById('admin-section').classList.add('hidden');
            }
        });

        // إضافة منتج للداتابيز
        window.addProduct = async () => {
            const catId = document.getElementById('cat-id').value;
            const name = document.getElementById('app-name').value;
            const img = document.getElementById('app-img').value;

            if(!name || !img) return alert("يرجى ملء جميع الحقول");

            try {
                await addDoc(collection(db, "products"), {
                    categoryId: catId,
                    name: name,
                    img: img,
                    createdAt: Date.now()
                });
                alert("تم إضافة التطبيق بنجاح!");
                document.getElementById('app-name').value = '';
                document.getElementById('app-img').value = '';
                loadProducts();
            } catch (e) {
                alert("خطأ: " + e.message);
            }
        };

        // تحميل المنتجات
        async function loadProducts() {
            const list = document.getElementById('products-list');
            list.innerHTML = 'جاري التحميل...';
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                list.innerHTML = '';
                querySnapshot.forEach((document) => {
                    const data = document.data();
                    const div = document.createElement('div');
                    div.className = 'bg-slate-800 p-4 rounded-xl flex justify-between items-center';
                    div.innerHTML = `
                        <div class="flex items-center gap-4">
                            <img src="${data.img}" class="w-12 h-12 object-contain bg-white rounded-lg p-1">
                            <div>
                                <div class="font-bold">${data.name}</div>
                                <div class="text-xs text-slate-400">${data.categoryId}</div>
                            </div>
                        </div>
                        <button onclick="deleteProduct('${document.id}')" class="text-red-500 hover:text-red-400"><i class="fa-solid fa-trash"></i> مسح</button>
                    `;
                    list.appendChild(div);
                });
            } catch (e) {
                list.innerHTML = "خطأ في تحميل المنتجات: " + e.message;
            }
        }

        // مسح منتج
        window.deleteProduct = async (id) => {
            if(confirm("هل أنت متأكد من مسح هذا التطبيق؟")) {
                await deleteDoc(doc(db, "products", id));
                loadProducts();
            }
        };
    </script>
</body>
</html>
