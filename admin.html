<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | MARO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style> body { font-family: 'Cairo', sans-serif; background: #0f172a; color: white; } </style>
</head>
<body class="p-6">

    <!-- تسجيل الدخول -->
    <div id="login-section" class="max-w-md mx-auto mt-20 bg-slate-800 p-8 rounded-2xl shadow-xl">
        <h2 class="text-2xl font-black mb-6 text-center text-cyan-400">تسجيل دخول الإدارة</h2>
        <input type="email" id="email" placeholder="البريد الإلكتروني" class="w-full mb-4 p-3 rounded-lg bg-slate-900 border border-slate-700 text-white outline-none focus:border-cyan-400">
        <input type="password" id="password" placeholder="كلمة المرور" class="w-full mb-6 p-3 rounded-lg bg-slate-900 border border-slate-700 text-white outline-none focus:border-cyan-400">
        <button onclick="login()" class="w-full bg-cyan-500 text-black font-bold py-3 rounded-lg hover:bg-cyan-400 transition">دخول</button>
        <p id="login-error" class="text-red-500 text-sm mt-4 text-center hidden"></p>
    </div>

    <!-- لوحة التحكم -->
    <div id="admin-section" class="hidden max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-8 border-b border-slate-700 pb-4">
            <h1 class="text-3xl font-black text-cyan-400">لوحة الإدارة</h1>
            <button onclick="logout()" class="bg-red-500 px-4 py-2 rounded-lg font-bold hover:bg-red-600">تسجيل خروج</button>
        </div>

        <!-- إضافة منتج -->
        <div class="bg-slate-800 p-6 rounded-2xl mb-8">
            <h2 class="text-xl font-bold mb-4">إضافة منتج جديد</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                
                <select id="cat-id" class="p-3 rounded-lg bg-slate-900 border border-slate-700 text-white outline-none">
                    <option value="games">الألعاب</option>
                    <option value="subscriptions">الاشتراكات</option>
                    <option value="giftcards">البطاقات الرقمية</option>
                    <option value="creative">التصميم</option>
                    <option value="software">البرمجيات</option>
                    <option value="tech">الخدمات التقنية</option>
                    <option value="finance">الحوالات</option>
                    <option value="support">خدمات متنوعة</option>
                </select>

                <input type="text" id="app-name" placeholder="اسم المنتج" class="p-3 rounded-lg bg-slate-900 border border-slate-700 text-white outline-none">
                
                <input type="number" id="app-price" placeholder="السعر (مثال: 15)" class="p-3 rounded-lg bg-slate-900 border border-slate-700 text-white outline-none">
                
                <select id="price-mode" class="p-3 rounded-lg bg-slate-900 border border-slate-700 text-white outline-none">
                    <option value="fixed">سعر ثابت</option>
                    <option value="from">يبدأ من</option>
                </select>

                <input type="text" id="app-tag" placeholder="الشارة (مثال: شحن فوري، حسب الطلب)" class="p-3 rounded-lg bg-slate-900 border border-slate-700 text-white outline-none">
                
                <select id="app-icon" class="p-3 rounded-lg bg-slate-900 border border-slate-700 text-white outline-none">
                    <option value="spark">أيقونة نجمة (Spark)</option>
                    <option value="game">أيقونة ألعاب (Game)</option>
                    <option value="play">أيقونة تشغيل (Play)</option>
                    <option value="flame">أيقونة لهب (Flame)</option>
                    <option value="screen">أيقونة شاشة (Screen)</option>
                    <option value="bot">أيقونة بوت (Bot)</option>
                    <option value="pen">أيقونة تصميم (Pen)</option>
                    <option value="window">أيقونة برامج (Window)</option>
                    <option value="gift">أيقونة هدايا (Gift)</option>
                    <option value="wallet">أيقونة محفظة (Wallet)</option>
                    <option value="code">أيقونة برمجة (Code)</option>
                    <option value="shield">أيقونة حماية (Shield)</option>
                </select>

                <select id="app-art" class="p-3 rounded-lg bg-slate-900 border border-slate-700 text-white outline-none">
                    <option value="art-games">خلفية ألعاب (أزرق غامق)</option>
                    <option value="art-stream">خلفية ترفيه (بنفسجي)</option>
                    <option value="art-shahid">خلفية ذهبية</option>
                    <option value="art-bot">خلفية تكنولوجيا</option>
                    <option value="art-design">خلفية إبداعية</option>
                    <option value="art-software">خلفية برمجيات</option>
                    <option value="art-gift">خلفية هدايا</option>
                    <option value="art-money">خلفية أموال</option>
                    <option value="art-web">خلفية ويب</option>
                    <option value="art-support">خلفية دعم</option>
                    <option value="art-extra">خلفية عامة</option>
                </select>

                <textarea id="app-desc" placeholder="وصف المنتج" class="p-3 rounded-lg bg-slate-900 border border-slate-700 text-white outline-none md:col-span-2" rows="2"></textarea>
                
                <button onclick="addProduct()" class="bg-cyan-500 text-black font-bold py-3 rounded-lg hover:bg-cyan-400 transition md:col-span-2">إضافة المنتج</button>
            </div>
        </div>

        <!-- قائمة المنتجات -->
        <h2 class="text-xl font-bold mb-4">المنتجات الحالية</h2>
        <div id="products-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ⚠️ كود Firebase الخاص بك
        const firebaseConfig = {
            apiKey: "AIzaSyAZucoNuZyKDoxfS7tboc3-ZttqONuw_vw",
            authDomain: "maro-store-4dc09.firebaseapp.com",
            projectId: "maro-store-4dc09",
            storageBucket: "maro-store-4dc09.firebasestorage.app",
            messagingSenderId: "55163169834",
            appId: "1:55163169834:web:48ba5eda57e23c41886753"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.login = () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            signInWithEmailAndPassword(auth, email, password)
                .catch(err => {
                    const errEl = document.getElementById('login-error');
                    errEl.innerText = "خطأ: تأكد من الإيميل والباسورد";
                    errEl.classList.remove('hidden');
                });
        };

        window.logout = () => signOut(auth);

        onAuthStateChanged(auth, user => {
            if (user) {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('admin-section').classList.remove('hidden');
                loadProducts();
            } else {
                document.getElementById('login-section').classList.remove('hidden');
                document.getElementById('admin-section').classList.add('hidden');
            }
        });

        window.addProduct = async () => {
            const categoryId = document.getElementById('cat-id').value;
            const name = document.getElementById('app-name').value;
            const price = parseFloat(document.getElementById('app-price').value);
            const priceMode = document.getElementById('price-mode').value;
            const tag = document.getElementById('app-tag').value;
            const icon = document.getElementById('app-icon').value;
            const art = document.getElementById('app-art').value;
            const description = document.getElementById('app-desc').value;

            if(!name || isNaN(price)) return alert("يرجى ملء اسم المنتج والسعر");

            try {
                await addDoc(collection(db, "products"), {
                    categoryId: categoryId,
                    name: name,
                    price: price,
                    priceMode: priceMode,
                    tag: tag || "رقمي",
                    icon: icon,
                    art: art,
                    description: description || "لا يوجد وصف.",
                    createdAt: Date.now()
                });
                alert("تم إضافة المنتج بنجاح!");
                document.getElementById('app-name').value = '';
                document.getElementById('app-price').value = '';
                document.getElementById('app-desc').value = '';
                loadProducts();
            } catch (e) {
                alert("خطأ: " + e.message);
            }
        };

        async function loadProducts() {
            const list = document.getElementById('products-list');
            list.innerHTML = 'جاري التحميل...';
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                list.innerHTML = '';
                querySnapshot.forEach((document) => {
                    const data = document.data();
                    const div = document.createElement('div');
                    div.className = 'bg-slate-800 p-4 rounded-xl flex justify-between items-center';
                    div.innerHTML = `
                        <div>
                            <div class="font-bold">${data.name}</div>
                            <div class="text-sm text-cyan-400">${data.price}$</div>
                        </div>
                        <button onclick="deleteProduct('${document.id}')" class="text-red-500 hover:text-red-400 bg-red-500/10 px-3 py-1 rounded-lg">مسح</button>
                    `;
                    list.appendChild(div);
                });
            } catch (e) {
                list.innerHTML = "خطأ في تحميل المنتجات: " + e.message;
            }
        }

        window.deleteProduct = async (id) => {
            if(confirm("هل أنت متأكد من مسح هذا المنتج؟")) {
                await deleteDoc(doc(db, "products", id));
                loadProducts();
            }
        };
    </script>
</body>
</html>
