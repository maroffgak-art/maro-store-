<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARO | متجر الشحن الرقمي</title>
    
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src 'self' https://api.telegram.org;">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #060d1b; /* كحلي غامق جداً */
            --bg-card: #0b1528; /* كحلي الكارت */
            --bg-card-bottom: #101f3d; /* كحلي الجزء السفلي */
            --primary: #00f2fe;
            --text-main: #ffffff;
            --text-muted: #8ba3c7;
            --border-color: #1a2c4e;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            overflow-x: hidden;
            -webkit-user-select: none; 
            -webkit-touch-callout: none; 
            user-select: none;
        }

        /* الهيدر */
        .header-glass {
            background: rgba(6, 13, 27, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
        }

        /* خانة البحث */
        .search-input {
            background: #0b1528;
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 12px;
            padding: 12px 16px;
            width: 100%;
            transition: 0.3s;
        }
        .search-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
        }

        /* كارت التطبيق */
        .app-card {
            background: var(--bg-card);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: transform 0.2s, border-color 0.2s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }
        .app-card:hover {
            transform: translateY(-3px);
            border-color: var(--primary);
        }
        .app-logo {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            background: #fff; /* خلفية بيضاء للوجو */
        }
        .app-info {
            background: var(--bg-card-bottom);
            padding: 12px 8px;
            text-align: center;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .app-title {
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 4px;
            color: #fff;
        }
        .app-price {
            color: var(--primary);
            font-weight: 900;
            font-size: 16px;
        }

        /* نافذة الخيارات */
        .modal-overlay { background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(5px); opacity: 0; visibility: hidden; transition: all 0.3s; position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 1rem; z-index: 100; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 20px; width: 100%; max-width: 400px; padding: 24px; transform: scale(0.9); transition: 0.3s; max-height: 90vh; overflow-y: auto;}
        .modal-overlay.active .modal-content { transform: scale(1); }

        /* السلة */
        #cart-drawer { background: var(--bg-card); border-right: 1px solid var(--border-color); }
    </style>
</head>
<body class="pb-24 md:pb-0">

    <!-- الهيدر -->
    <header class="fixed top-0 w-full z-40 header-glass transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center gap-4">
            <!-- اللوجو -->
            <a href="#" class="flex items-center gap-2 min-w-fit">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-[#00f2fe] to-[#4facfe] flex items-center justify-center shadow-lg shadow-cyan-500/20">
                    <i class="fa-solid fa-cube text-black text-lg"></i>
                </div>
                <span class="text-xl font-black tracking-widest text-white hidden sm:block">MARO<span class="text-[#00f2fe]">.</span></span>
            </a>

            <!-- خانة البحث -->
            <div class="flex-1 max-w-md relative">
                <input type="text" class="search-input pl-10" placeholder="ابحث عن قسم...">
                <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-500"></i>
            </div>
            
            <!-- الأزرار -->
            <div class="flex items-center gap-2">
                <a href="https://t.me/qijub" target="_blank" rel="noopener noreferrer" class="w-10 h-10 rounded-full bg-[#0b1528] border border-[#1a2c4e] flex items-center justify-center hover:bg-white/10 transition">
                    <i class="fa-brands fa-telegram text-[#00f2fe]"></i>
                </a>
                
                <button onclick="toggleCart()" class="relative w-10 h-10 rounded-full bg-[#0b1528] border border-[#1a2c4e] flex items-center justify-center hover:bg-white/10 transition">
                    <i class="fa-solid fa-cart-shopping text-white"></i>
                    <span id="cart-count" class="absolute -top-1 -right-1 w-5 h-5 bg-[#00f2fe] text-black text-xs font-black flex items-center justify-center rounded-full">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- المحتوى -->

        <!-- شبكة التطبيقات -->
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 md:gap-4">

                <img src="https://play-lh.googleusercontent.com/1N1q7T-j-8sK1p2Gq3R4s5t6u7v8w9x0y1z2A3B4C5D6E7F8G9H0=s180" class="app-logo" alt="Mico">
                <div class="app-info">
                    <div class="app-title">Mico Live</div>
                    <div class="app-price">$1.035</div>
                </div>
            </div>

            <!-- تطبيق 2 -->
            <div class="app-card" onclick="openSubMenu('yalla', 'Yalla Ludo', 'https://play-lh.googleusercontent.com/2p8gS5Nk7W8X9Y0Z1A2B3C4D5E6F7G8H9I0J1K=s180')">
                <img src="https://play-lh.googleusercontent.com/2p8gS5Nk7W8X9Y0Z1A2B3C4D5E6F7G8H9I0J1K=s180" class="app-logo" alt="Yalla">
                <div class="app-info">

            </div>

            <!-- تطبيق 3 -->
            <div class="app-card" onclick="openSubMenu('wechill', 'We Chill', 'https://play-lh.googleusercontent.com/3q4wE5R6T7Y8U9I0O1P2A3S4D5F6G7H8J9K0L=s180')">
                <img src="https://play-lh.googleusercontent.com/3q4wE5R6T7Y8U9I0O1P2A3S4D5F6G7H8J9K0L=s180" class="app-logo" alt="WeChill">
                <div class="app-info">
                    <div class="app-title">We Chill</div>

            <!-- تطبيق 4 -->
            <div class="app-card" onclick="openSubMenu('pubg', 'PUBG Mobile', 'https://play-lh.googleusercontent.com/9Xk8Y7W6V5U4T3S2R1Q0P9O8N7M6L5K4J3H2G=s180')">
                <img src="https://play-lh.googleusercontent.com/9Xk8Y7W6V5U4T3S2R1Q0P9O8N7M6L5K4J3H2G=s180" class="app-logo" alt="PUBG">

            <!-- تطبيق 5 -->

                <img src="https://play-lh.googleusercontent.com/8V7U6T5S4R3Q2P1O0N9M8L7K6J5H4G3F2E1D=s180" class="app-logo" alt="Free Fire">
                <div class="app-info">
                    <div class="app-title">Free Fire</div>
                    <div class="app-price">$1.224</div>

            </div>

            <!-- تطبيق 6 -->
            <div class="app-card" onclick="openSubMenu('crush', 'Crush Live', 'https://play-lh.googleusercontent.com/7T6S5R4Q3P2O1N0M9L8K7J6H5G4F3E2D1C0B=s180')">
                <img src="https://play-lh.googleusercontent.com/7T6S5R4Q3P2O1N0M9L8K7J6H5G4F3E2D1C0B=s180" class="app-logo" alt="Crush">
                <div class="app-info">
                    <div class="app-title">Crush Live</div>

            </div>

            <!-- تطبيق 7 -->
            <div class="app-card" onclick="openSubMenu('roka', 'Roka Live', 'https://play-lh.googleusercontent.com/6S5R4Q3P2O1N0M9L8K7J6H5G4F3E2D1C0B9A=s180')">
                <img src="https://play-lh.googleusercontent.com/6S5R4Q3P2O1N0M9L8K7J6H5G4F3E2D1C0B9A=s180" class="app-logo" alt="Roka">
                <div class="app-info">
                    <div class="app-title">Roka Live</div>

            </div>

            <!-- تطبيق 8 -->
            <div class="app-card" onclick="openSubMenu('yoki', 'Yoki Chat', 'https://play-lh.googleusercontent.com/5R4Q3P2O1N0M9L8K7J6H5G4F3E2D1C0B9A8Z=s180')">
                <img src="https://play-lh.googleusercontent.com/5R4Q3P2O1N0M9L8K7J6H5G4F3E2D1C0B9A8Z=s180" class="app-logo" alt="Yoki">
                <div class="app-info">
                    <div class="app-title">Yoki Chat</div>
                    <div class="app-price">$1.526</div>
                </div>
            </div>

            <!-- تطبيق 9 -->
            <div class="app-card" onclick="openSubMenu('sky', 'Sky Chat', 'https://play-lh.googleusercontent.com/4Q3P2O1N0M9L8K7J6H5G4F3E2D1C0B9A8Z7Y=s180')">
                <img src="https://play-lh.googleusercontent.com/4Q3P2O1N0M9L8K7J6H5G4F3E2D1C0B9A8Z7Y=s180" class="app-logo" alt="Sky">
                <div class="app-info">
                    <div class="app-title">Sky Chat</div>
                    <div class="app-price">$0.528</div>
                </div>
            </div>

            <!-- تطبيق 10 -->
            <div class="app-card" onclick="openSubMenu('doli', 'Doli Live', 'https://play-lh.googleusercontent.com/3P2O1N0M9L8K7J6H5G4F3E2D1C0B9A8Z7Y6X=s180')">
                <img src="https://play-lh.googleusercontent.com/3P2O1N0M9L8K7J6H5G4F3E2D1C0B9A8Z7Y6X=s180" class="app-logo" alt="Doli">
                <div class="app-info">
                    <div class="app-title">Doli Live</div>
                    <div class="app-price">$1.224</div>
                </div>
            </div>

        </div>
    </main>

    <!-- سلة المشتريات -->
    <div id="cart-drawer" class="fixed inset-y-0 right-0 w-full md:w-96 shadow-2xl z-[100] transform translate-x-full transition-transform duration-300 ease-in-out flex flex-col">
        <div class="p-6 border-b border-[#1a2c4e] flex justify-between items-center bg-[#0b1528]">
            <h3 class="text-xl font-black flex items-center gap-2"><i class="fa-solid fa-cart-shopping text-[#00f2fe]"></i> سلة المشتريات</h3>
            <button onclick="toggleCart()" class="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center hover:bg-red-500 transition"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="cart-items" class="flex-1 p-6 overflow-y-auto flex flex-col gap-4 bg-[#060d1b]">
            <div class="text-center text-gray-500 mt-10">السلة فارغة حالياً</div>
        </div>
        <div class="p-6 border-t border-[#1a2c4e] bg-[#0b1528]">
            <div class="flex justify-between items-center mb-4 text-xl font-black">
                <span>المجموع الكلي:</span>
                <span id="cart-total" class="text-[#00f2fe]">$0</span>
            </div>
            <button onclick="checkout()" class="w-full bg-gradient-to-r from-[#00f2fe] to-[#4facfe] text-black py-4 rounded-xl font-black text-lg mb-2 hover:opacity-90 transition">أرسل طلبك إلى تليجرام</button>
        </div>
    </div>

    <!-- نافذة الخيارات -->
    <div id="sub-modal" class="modal-overlay">
        <div class="modal-content">
            <button onclick="closeSubMenu()" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-white/5 flex items-center justify-center hover:bg-red-500 transition text-white"><i class="fa-solid fa-xmark"></i></button>
            
            <img id="sub-img" src="" class="w-20 h-20 mx-auto rounded-2xl object-cover mb-4 shadow-lg border-2 border-[#00f2fe] bg-white">
            <h3 id="sub-title" class="text-2xl font-black mb-6 text-white text-center">اسم القسم</h3>
            
            <div id="sub-options" class="flex flex-col gap-3">
                <!-- الخيارات هتتولد هنا بالجافاسكريبت -->
            </div>
        </div>
    </div>

    <script>
        // بيانات التطبيقات والخيارات
        const productData = {
            pubg: [
                { name: '100 شدة ببجي', price: 1.5 },
                { name: '500 شدة ببجي', price: 7 },
                { name: '1000 شدة ببجي', price: 14 },
                { name: '2000 شدة ببجي', price: 27 }
            ],
            freefire: [
                { name: '100 جوهرة', price: 1.2 },
                { name: '500 جوهرة', price: 6 },
                { name: '1000 جوهرة', price: 11 }
            ],
            mico: [
                { name: '1000 عملة', price: 1 },
                { name: '5000 عملة', price: 5 },
                { name: '10000 عملة', price: 9 }
            ],
            yalla: [
                { name: '1000 جوهرة', price: 0.5 },
                { name: '5000 جوهرة', price: 2 },
                { name: '10000 جوهرة', price: 4 }
            ],
            wechill: [
                { name: '1000 عملة', price: 1 },
                { name: '5000 عملة', price: 5 }
            ],
            // ... ممكن تزود باقي التطبيقات بنفس الطريقة
        };

        const subModal = document.getElementById('sub-modal');
        const subTitle = document.getElementById('sub-title');
        const subImg = document.getElementById('sub-img');
        const subOptions = document.getElementById('sub-options');

        function openSubMenu(categoryKey, title, imgUrl) {
            subTitle.innerText = title;
            subImg.src = imgUrl;
            subOptions.innerHTML = '';

            // لو التطبيق ده مش متسجل في الداتا بيز بتاعتنا، نستخدم خيارات افتراضية
            const options = productData[categoryKey] || [
                { name: 'باقة صغيرة', price: 1 },
                { name: 'باقة متوسطة', price: 5 },
                { name: 'باقة كبيرة', price: 10 }
            ];
            
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'w-full flex justify-between items-center p-4 rounded-xl border border-[#1a2c4e] hover:border-[#00f2fe] transition bg-[#0b1528]';
                btn.innerHTML = `
                    <span class="font-bold text-white">${opt.name}</span>
                    <div class="flex items-center gap-3">
                        <span class="text-[#00f2fe] font-black">$${opt.price}</span>
                        <i class="fa-solid fa-plus text-xs bg-[#00f2fe] text-black w-6 h-6 rounded-full flex items-center justify-center"></i>
                    </div>
                `;
                btn.onclick = () => {
                    addToCart(categoryKey + '-' + opt.name, opt.name, opt.price);
                    closeSubMenu();
                };
                subOptions.appendChild(btn);
            });

            subModal.classList.add('active');
        }

        function closeSubMenu() {
            subModal.classList.remove('active');
        }

        // إغلاق النوافذ عند النقر بالخارج
        window.addEventListener('click', (e) => {
            if (e.target === subModal) closeSubMenu();
        });

        // --- نظام السلة ---
        let cart = [];
        const cartDrawer = document.getElementById('cart-drawer');
        const cartItemsContainer = document.getElementById('cart-items');
        const cartCountElements = [document.getElementById('cart-count')];
        const cartTotalElement = document.getElementById('cart-total');

        function toggleCart() {
            cartDrawer.classList.toggle('translate-x-full');
        }

        function addToCart(id, name, price) {
            const existingItem = cart.find(item => item.id === id);
            if (existingItem) {
                existingItem.qty += 1;
            } else {
                cart.push({ id: id, name: name, price: price, qty: 1 });
            }
            updateCartUI();
            cartDrawer.classList.remove('translate-x-full');
        }

        function increaseQty(id) {
            const item = cart.find(item => item.id === id);
            if (item) { item.qty += 1; updateCartUI(); }
        }

        function decreaseQty(id) {
            const item = cart.find(item => item.id === id);
            if (item) {
                item.qty -= 1;
                if (item.qty <= 0) {
                    cart = cart.filter(i => i.id !== id);
                }
                updateCartUI();
            }
        }

        function updateCartUI() {
            const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            cartCountElements.forEach(el => el.innerText = totalItems);
            cartTotalElement.innerText = `$${totalPrice.toFixed(3)}`;
            
            cartItemsContainer.innerHTML = '';
            if (cart.length === 0) {
                cartItemsContainer.innerHTML = '<div class="text-center text-gray-500 mt-10">السلة فارغة حالياً</div>';
                return;
            }

            cart.forEach(item => {
                const div = document.createElement('div');
                div.className = 'bg-[#0b1528] border border-[#1a2c4e] p-4 rounded-xl flex flex-col gap-3';
                
                div.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div class="font-bold text-sm text-white">${item.name}</div>
                        <div class="text-[#00f2fe] font-black">$${(item.price * item.qty).toFixed(3)}</div>
                    </div>
                    <div class="flex items-center justify-between bg-[#060d1b] rounded-lg p-1 border border-[#1a2c4e]">
                        <button onclick="decreaseQty('${item.id}')" class="w-8 h-8 flex items-center justify-center hover:bg-red-500/20 text-red-400 rounded-md transition"><i class="fa-solid fa-minus"></i></button>
                        <span class="font-bold text-white">${item.qty}</span>
                        <button onclick="increaseQty('${item.id}')" class="w-8 h-8 flex items-center justify-center hover:bg-green-500/20 text-green-400 rounded-md transition"><i class="fa-solid fa-plus"></i></button>
                    </div>
                `;
                cartItemsContainer.appendChild(div);
            });
        }

        function checkout() {
            if(cart.length === 0) {
                alert("السلة فارغة! اختر منتجاً أولاً.");
                return;
            }
            
            let message = "مرحباً MARO Store،\nأريد طلب المنتجات التالية:\n\n";
            let totalPrice = 0;
            
            cart.forEach((item) => {
                message += `🔹 ${item.name} (الكمية: ${item.qty}) - $${(item.price * item.qty).toFixed(3)}\n`;
                totalPrice += item.price * item.qty;
            });
            
            message += `\n💰 المجموع الكلي: $${totalPrice.toFixed(3)}\n`;
            message += "\nالرجاء تأكيد الطلب وتزويدي بتفاصيل الدفع.";
            
            const encodedMessage = encodeURIComponent(message);
            window.open(`https://t.me/qijub?text=${encodedMessage}`, '_blank', 'noopener,noreferrer');
        }
    </script>
</body>
</html>
