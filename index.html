<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sahm Store | شحن ألعاب وتطبيقات</title>
    
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src 'self' https://api.telegram.org;">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-page: #f8fafc;
            --bg-card: #ffffff;
            --bg-card-bottom: #0b1528;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --primary: #0068e8;
            --primary-glow: rgba(0, 104, 232, 0.2);
        }

        body.dark-mode {
            --bg-page: #060d1b;
            --bg-card: #0b1528;
            --bg-card-bottom: #101f3d;
            --text-main: #ffffff;
            --text-muted: #8ba3c7;
            --border-color: #1a2c4e;
            --primary: #00f2fe;
            --primary-glow: rgba(0, 242, 254, 0.2);
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            transition: background-color 0.3s, color 0.3s;
            overflow-x: hidden;
            -webkit-user-select: none; 
            -webkit-touch-callout: none; 
            user-select: none;
        }

        /* الهيدر */
        .header-glass {
            background: var(--bg-page);
            border-bottom: 1px solid var(--border-color);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 40;
        }

        /* البحث */
        .search-input {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 12px;
            padding: 10px 16px 10px 40px;
            width: 100%;
            transition: 0.3s;
        }
        .search-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        /* كارت التطبيق */
        .app-card {
            background: var(--bg-card);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: transform 0.2s, border-color 0.2s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }
        .app-card:hover {
            transform: translateY(-3px);
            border-color: var(--primary);
        }
        
        .app-logo {
            width: 100%;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: white;
        }

        .app-info {
            background: var(--bg-card-bottom);
            padding: 12px 8px;
            text-align: center;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .app-title {
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 4px;
            color: #fff;
        }
        .app-price {
            color: var(--primary);
            font-weight: 900;
            font-size: 16px;
        }

        /* التبديل بين الصفحات */
        .view-section {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .view-section.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-overlay { background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(5px); opacity: 0; visibility: hidden; transition: all 0.3s; position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 1rem; z-index: 100; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 20px; width: 100%; max-width: 400px; padding: 24px; transform: scale(0.9); transition: 0.3s; max-height: 90vh; overflow-y: auto;}
        .modal-overlay.active .modal-content { transform: scale(1); }

        #cart-drawer { background: var(--bg-card); border-right: 1px solid var(--border-color); }
    </style>
</head>
<body class="pb-24 md:pb-0">

    <!-- الهيدر -->
    <header class="header-glass transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center gap-2">
            <!-- اللوجو -->
            <a href="#" onclick="goHome()" class="flex items-center gap-2 min-w-fit">
                <div class="w-10 h-10 rounded-xl bg-[#0068e8] flex items-center justify-center shadow-lg">
                    <i class="fa-solid fa-cart-shopping text-white text-lg"></i>
                </div>
                <span class="text-xl font-black tracking-widest text-[var(--text-main)] hidden sm:block">SAHM<span class="text-[#0068e8]">.</span></span>
            </a>

            <!-- خانة البحث -->
            <div class="flex-1 max-w-md relative">
                <input type="text" id="searchInput" class="search-input" placeholder="ابحث عن قسم أو تطبيق..." onkeyup="filterSearch()">
                <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-[var(--text-muted)]"></i>
            </div>
            
            <!-- الأزرار -->
            <div class="flex items-center gap-2">
                <!-- زرار الوضع الليلي -->
                <button onclick="toggleTheme()" class="w-10 h-10 rounded-full bg-[var(--bg-card)] border border-[var(--border-color)] flex items-center justify-center hover:opacity-80 transition">
                    <i id="theme-icon" class="fa-solid fa-moon text-[var(--text-main)]"></i>
                </button>

                <a href="https://t.me/qijub" target="_blank" rel="noopener noreferrer" class="w-10 h-10 rounded-full bg-[var(--bg-card)] border border-[var(--border-color)] flex items-center justify-center hover:opacity-80 transition">
                    <i class="fa-brands fa-telegram text-[#0068e8]"></i>
                </a>
                
                <button onclick="toggleCart()" class="relative w-10 h-10 rounded-full bg-[var(--bg-card)] border border-[var(--border-color)] flex items-center justify-center hover:opacity-80 transition">
                    <i class="fa-solid fa-cart-shopping text-[var(--text-main)]"></i>
                    <span id="cart-count" class="absolute -top-1 -right-1 w-5 h-5 bg-[#0068e8] text-white text-xs font-black flex items-center justify-center rounded-full">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- المحتوى -->
    <main class="max-w-7xl mx-auto px-4 mt-24 relative z-10">
        
        <!-- الصفحة الرئيسية (الفئات) -->
        <div id="view-home" class="view-section active">
            <div class="flex items-center justify-between mb-6 bg-[var(--bg-card)] border border-[var(--border-color)] rounded-xl p-4 mt-4">
                <h2 class="text-lg font-bold">كل الأقسام</h2>
                <i class="fa-solid fa-layer-group text-[#0068e8]"></i>
            </div>

            <div id="home-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 md:gap-4">
                <!-- سيتم توليد الفئات هنا -->
            </div>
        </div>

        <!-- صفحة تفاصيل القسم -->
        <div id="view-category" class="view-section mt-4">
            <div class="flex items-center gap-3 mb-6 bg-[var(--bg-card)] border border-[var(--border-color)] rounded-xl p-4 cursor-pointer hover:bg-black/5 transition" onclick="goHome()">
                <i class="fa-solid fa-arrow-right text-[#0068e8]"></i>
                <h2 id="category-title" class="text-lg font-bold">اسم القسم</h2>
            </div>

            <div id="category-items" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 md:gap-4">
                <!-- العناصر هتتولد هنا -->
            </div>
        </div>

    </main>

    <!-- سلة المشتريات -->
    <div id="cart-drawer" class="fixed inset-y-0 right-0 w-full md:w-96 shadow-2xl z-[100] transform translate-x-full transition-transform duration-300 ease-in-out flex flex-col">
        <div class="p-6 border-b border-[var(--border-color)] flex justify-between items-center bg-[var(--bg-card)]">
            <h3 class="text-xl font-black flex items-center gap-2"><i class="fa-solid fa-cart-shopping text-[#0068e8]"></i> سلة المشتريات</h3>
            <button onclick="toggleCart()" class="w-8 h-8 rounded-full bg-black/10 flex items-center justify-center hover:bg-red-500 transition"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="cart-items" class="flex-1 p-6 overflow-y-auto flex flex-col gap-4 bg-[var(--bg-page)]">
            <div class="text-center text-[var(--text-muted)] mt-10">السلة فارغة حالياً</div>
        </div>
        <div class="p-6 border-t border-[var(--border-color)] bg-[var(--bg-card)]">
            <div class="flex justify-between items-center mb-4 text-xl font-black">
                <span>المجموع الكلي:</span>
                <span id="cart-total" class="text-[#0068e8]">$0</span>
            </div>
            <button onclick="checkout()" class="w-full bg-[#0068e8] text-white py-4 rounded-xl font-black text-lg mb-2 hover:opacity-90 transition shadow-lg">أرسل طلبك إلى تليجرام</button>
        </div>
    </div>

    <!-- نافذة الباقات -->
    <div id="sub-modal" class="modal-overlay">
        <div class="modal-content">
            <button onclick="closeSubMenu()" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-black/10 flex items-center justify-center hover:bg-red-500 transition text-[var(--text-main)]"><i class="fa-solid fa-xmark"></i></button>
            
            <div id="modal-icon" class="w-20 h-20 mx-auto rounded-2xl flex items-center justify-center text-4xl mb-4 shadow-lg border-2 border-[#0068e8] text-white"></div>
            <h3 id="modal-title" class="text-2xl font-black mb-6 text-[var(--text-main)] text-center">اسم التطبيق</h3>
            
            <div id="modal-options" class="flex flex-col gap-3">
                <!-- الخيارات هتتولد هنا -->
            </div>
        </div>
    </div>

    <script>
        // --- البيانات (قابلة للتعديل) ---
        const storeData = {
            games: {
                title: "قسم الألعاب",
                items: [
                    { id: "pubg", name: "PUBG Mobile", icon: "fa-crosshairs", color: "bg-gradient-to-br from-orange-500 to-yellow-600" },
                    { id: "freefire", name: "Free Fire", icon: "fa-fire", color: "bg-gradient-to-br from-red-500 to-orange-500" },
                    { id: "yalla", name: "Yalla Ludo", icon: "fa-dice", color: "bg-gradient-to-br from-green-400 to-emerald-600" }
                ]
            },
            apps: {
                title: "قسم التطبيقات",
                items: [
                    { id: "mico", name: "Mico Live", icon: "fa-comments", color: "bg-gradient-to-br from-purple-500 to-pink-500" },
                    { id: "yoki", name: "Yoki Chat", icon: "fa-comment-dots", color: "bg-gradient-to-br from-blue-500 to-indigo-600" },
                    { id: "sky", name: "Sky Chat", icon: "fa-cloud", color: "bg-gradient-to-br from-cyan-400 to-blue-500" }
                ]
            },
            subs: {
                title: "قسم الاشتراكات",
                items: [
                    { id: "netflix", name: "Netflix", icon: "fa-play", color: "bg-red-600" },
                    { id: "shahid", name: "Shahid VIP", icon: "fa-video", color: "bg-gradient-to-br from-teal-400 to-cyan-600" }
                ]
            },
            social: {
                title: "سوشيال ميديا",
                items: [
                    { id: "followers", name: "متابعين", icon: "fa-users", color: "bg-gradient-to-br from-blue-400 to-blue-600" },
                    { id: "likes", name: "لايكات", icon: "fa-heart", color: "bg-gradient-to-br from-pink-400 to-red-500" }
                ]
            }
        };

        // باقات كل تطبيق
        const packagesData = {
            pubg: { title: "PUBG Mobile", options: [{ name: '100 شدة', price: 1.5 }, { name: '500 شدة', price: 7 }, { name: '1000 شدة', price: 14 }] },
            freefire: { title: "Free Fire", options: [{ name: '100 جوهرة', price: 1.2 }, { name: '500 جوهرة', price: 6 }, { name: '1000 جوهرة', price: 11 }] },
            yalla: { title: "Yalla Ludo", options: [{ name: '1000 جوهرة', price: 0.5 }, { name: '5000 جوهرة', price: 2 }] },
            mico: { title: "Mico Live", options: [{ name: '1000 عملة', price: 1 }, { name: '5000 عملة', price: 5 }] },
            yoki: { title: "Yoki Chat", options: [{ name: '1000 عملة', price: 1 }, { name: '5000 عملة', price: 4.5 }] },
            sky: { title: "Sky Chat", options: [{ name: '1000 عملة', price: 0.5 }, { name: '5000 عملة', price: 2.5 }] },
            netflix: { title: "Netflix", options: [{ name: 'شهر واحد', price: 5 }, { name: '3 أشهر', price: 12 }] },
            shahid: { title: "Shahid VIP", options: [{ name: 'شهر واحد', price: 8 }, { name: '3 أشهر', price: 20 }] },
            followers: { title: "متابعين", options: [{ name: '1000 متابع', price: 2 }, { name: '5000 متابع', price: 8 }] },
            likes: { title: "لايكات", options: [{ name: '1000 لايك', price: 1 }, { name: '5000 لايك', price: 4 }] }
        };

        // --- الوضع الليلي ---
        function toggleTheme() {
            const body = document.body;
            const icon = document.getElementById('theme-icon');
            body.classList.toggle('dark-mode');
            if (body.classList.contains('dark-mode')) {
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
                localStorage.setItem('sahm-theme', 'dark');
            } else {
                icon.classList.remove('fa-sun');
                icon.classList.add('fa-moon');
                localStorage.setItem('sahm-theme', 'light');
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('sahm-theme');
            if (saved === 'dark') {
                document.body.classList.add('dark-mode');
                document.getElementById('theme-icon').classList.remove('fa-moon');
                document.getElementById('theme-icon').classList.add('fa-sun');
            }
            renderHome();
        });

        // --- التنقل بين الصفحات ---
        function goHome() {
            document.getElementById('view-home').classList.add('active');
            document.getElementById('view-category').classList.remove('active');
            document.getElementById('searchInput').value = '';
            renderHome();
        }

        function renderHome() {
            const grid = document.getElementById('home-grid');
            grid.innerHTML = '';
            for (let key in storeData) {
                const cat = storeData[key];
                const card = document.createElement('div');
                card.className = 'app-card';
                card.onclick = () => openCategory(key);
                card.innerHTML = `
                    <div class="app-logo bg-[#0068e8]">
                        <i class="fa-solid fa-layer-group"></i>
                    </div>
                    <div class="app-info">
                        <div class="app-title">${cat.title}</div>
                        <div class="app-price">تصفح</div>
                    </div>
                `;
                grid.appendChild(card);
            }
        }

        function openCategory(categoryKey) {
            const category = storeData[categoryKey];
            if(!category) return;

            document.getElementById('view-home').classList.remove('active');
            document.getElementById('view-category').classList.add('active');
            document.getElementById('category-title').innerText = category.title;

            const container = document.getElementById('category-items');
            container.innerHTML = '';

            category.items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'app-card';
                card.onclick = () => openPackages(item.id);
                card.innerHTML = `
                    <div class="app-logo ${item.color}">
                        <i class="fa-solid ${item.icon}"></i>
                    </div>
                    <div class="app-info">
                        <div class="app-title">${item.name}</div>
                        <div class="app-price">عرض الباقات</div>
                    </div>
                `;
                container.appendChild(card);
            });

            window.scrollTo(0, 0);
        }

        // --- البحث ---
        function filterSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const viewHome = document.getElementById('view-home');
            const viewCat = document.getElementById('view-category');
            
            if (viewHome.classList.contains('active')) {
                const cards = document.querySelectorAll('#home-grid .app-card');
                cards.forEach(card => {
                    const title = card.querySelector('.app-title').innerText.toLowerCase();
                    card.style.display = title.includes(query) ? '' : 'none';
                });
            } else {
                const cards = document.querySelectorAll('#category-items .app-card');
                cards.forEach(card => {
                    const title = card.querySelector('.app-title').innerText.toLowerCase();
                    card.style.display = title.includes(query) ? '' : 'none';
                });
            }
        }

        // --- نافذة الباقات ---
        const subModal = document.getElementById('sub-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalIcon = document.getElementById('modal-icon');
        const modalOptions = document.getElementById('modal-options');

        function openPackages(itemId) {
            const pkg = packagesData[itemId];
            if(!pkg) return;

            modalTitle.innerText = pkg.title;
            modalOptions.innerHTML = '';
            
            let iconClass = 'fa-box';
            let bgClass = 'bg-[#0068e8]';
            
            for(let key in storeData) {
                let found = storeData[key].items.find(i => i.id === itemId);
                if(found) {
                    iconClass = found.icon;
                    bgClass = found.color;
                    break;
                }
            }
            
            modalIcon.className = `w-20 h-20 mx-auto rounded-2xl flex items-center justify-center text-4xl mb-4 shadow-lg border-2 border-[#0068e8] text-white ${bgClass}`;
            modalIcon.innerHTML = `<i class="fa-solid ${iconClass}"></i>`;

            pkg.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'w-full flex justify-between items-center p-4 rounded-xl border border-[var(--border-color)] hover:border-[#0068e8] transition bg-[var(--bg-page)]';
                btn.innerHTML = `
                    <span class="font-bold text-[var(--text-main)]">${opt.name}</span>
                    <div class="flex items-center gap-3">
                        <span class="text-[#0068e8] font-black">$${opt.price}</span>
                        <i class="fa-solid fa-plus text-xs bg-[#0068e8] text-white w-6 h-6 rounded-full flex items-center justify-center"></i>
                    </div>
                `;
                btn.onclick = () => {
                    addToCart(itemId + '-' + opt.name, pkg.title + ' - ' + opt.name, opt.price);
                    closeSubMenu();
                };
                modalOptions.appendChild(btn);
            });

            subModal.classList.add('active');
        }

        function closeSubMenu() {
            subModal.classList.remove('active');
        }

        window.addEventListener('click', (e) => {
            if (e.target === subModal) closeSubMenu();
        });

        // --- السلة ---
        let cart = [];
        const cartDrawer = document.getElementById('cart-drawer');
        const cartItemsContainer = document.getElementById('cart-items');
        const cartCountElements = [document.getElementById('cart-count')];
        const cartTotalElement = document.getElementById('cart-total');

        function toggleCart() {
            cartDrawer.classList.toggle('translate-x-full');
        }

        function addToCart(id, name, price) {
            const existingItem = cart.find(item => item.id === id);
            if (existingItem) {
                existingItem.qty += 1;
            } else {
                cart.push({ id: id, name: name, price: price, qty: 1 });
            }
            updateCartUI();
            cartDrawer.classList.remove('translate-x-full');
        }

        function increaseQty(id) {
            const item = cart.find(item => item.id === id);
            if (item) { item.qty += 1; updateCartUI(); }
        }

        function decreaseQty(id) {
            const item = cart.find(item => item.id === id);
            if (item) {
                item.qty -= 1;
                if (item.qty <= 0) {
                    cart = cart.filter(i => i.id !== id);
                }
                updateCartUI();
            }
        }

        function updateCartUI() {
            const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            cartCountElements.forEach(el => el.innerText = totalItems);
            cartTotalElement.innerText = `$${totalPrice.toFixed(3)}`;
            
            cartItemsContainer.innerHTML = '';
            if (cart.length === 0) {
                cartItemsContainer.innerHTML = '<div class="text-center text-[var(--text-muted)] mt-10">السلة فارغة حالياً</div>';
                return;
            }

            cart.forEach(item => {
                const div = document.createElement('div');
                div.className = 'bg-[var(--bg-card)] border border-[var(--border-color)] p-4 rounded-xl flex flex-col gap-3';
                
                div.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div class="font-bold text-sm text-[var(--text-main)]">${item.name}</div>
                        <div class="text-[#0068e8] font-black">$${(item.price * item.qty).toFixed(3)}</div>
                    </div>
                    <div class="flex items-center justify-between bg-[var(--bg-page)] rounded-lg p-1 border border-[var(--border-color)]">
                        <button onclick="decreaseQty('${item.id}')" class="w-8 h-8 flex items-center justify-center hover:bg-red-500/20 text-red-400 rounded-md transition"><i class="fa-solid fa-minus"></i></button>
                        <span class="font-bold text-[var(--text-main)]">${item.qty}</span>
                        <button onclick="increaseQty('${item.id}')" class="w-8 h-8 flex items-center justify-center hover:bg-green-500/20 text-green-400 rounded-md transition"><i class="fa-solid fa-plus"></i></button>
                    </div>
                `;
                cartItemsContainer.appendChild(div);
            });
        }

        function checkout() {
            if(cart.length === 0) {
                alert("السلة فارغة! اختر منتجاً أولاً.");
                return;
            }
            
            let message = "مرحباً Sahm Store،\nأريد طلب المنتجات التالية:\n\n";
            let totalPrice = 0;
            
            cart.forEach((item) => {
                message += `🔹 ${item.name} (الكمية: ${item.qty}) - $${(item.price * item.qty).toFixed(3)}\n`;
                totalPrice += item.price * item.qty;
            });
            
            message += `\n💰 المجموع الكلي: $${totalPrice.toFixed(3)}\n`;
            message += "\nالرجاء تأكيد الطلب وتزويدي بتفاصيل الدفع.";
            
            const encodedMessage = encodeURIComponent(message);
            window.open(`https://t.me/qijub?text=${encodedMessage}`, '_blank', 'noopener,noreferrer');
        }
    </script>
</body>
</html>
