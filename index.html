<!-- استدعاء Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ⚠️ ضع كود Firebase الخاص بك هنا
        const firebaseConfig = {
            apiKey: "AIzaSyAZucoNuZyKDoxfS7tboc3-ZttqONuw_vw",
            authDomain: "maro-store-4dc09.firebaseapp.com",
            projectId: "maro-store-4dc09",
            storageBucket: "maro-store-4dc09.firebasestorage.app",
            messagingSenderId: "55163169834",
            appId: "1:55163169834:web:48ba5eda57e23c41886753"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // بيانات الأقسام الثابتة
        const storeData = {
            games: { title: "قسم الألعاب", cover: "https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=500" },
            apps: { title: "تطبيقات الدردشة", cover: "https://images.unsplash.com/photo-1611162617474-5b21e879e113?q=80&w=500" },
            subs: { title: "الاشتراكات", cover: "https://images.unsplash.com/photo-1522869635100-9f4c5e86aa37?q=80&w=500" },
            social: { title: "سوشيال ميديا", cover: "https://images.unsplash.com/photo-1563986768609-322da13575f3?q=80&w=500" }
        };

        let dynamicProducts = [];

        // جلب البيانات من Firebase
        async function fetchData() {
            const querySnapshot = await getDocs(collection(db, "products"));
            dynamicProducts = [];
            querySnapshot.forEach((doc) => {
                dynamicProducts.push({ id: doc.id, ...doc.data() });
            });
            renderHome();
        }

        // الوضع الليلي
        window.toggleTheme = () => {
            const body = document.body;
            const icon = document.getElementById('theme-icon');
            body.classList.toggle('dark-mode');
            if (body.classList.contains('dark-mode')) {
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
            } else {
                icon.classList.remove('fa-sun');
                icon.classList.add('fa-moon');
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            fetchData();
        });

        // التنقل
        window.goHome = () => {
            document.getElementById('view-home').classList.add('active');
            document.getElementById('view-category').classList.remove('active');
            document.getElementById('searchInput').value = '';
            renderHome();
        };

        function renderHome() {
            const grid = document.getElementById('home-grid');
            grid.innerHTML = '';
            for (let key in storeData) {
                const cat = storeData[key];
                const card = document.createElement('div');
                card.className = 'app-card';
                card.onclick = () => openCategory(key);
                card.innerHTML = `
                    <img src="${cat.cover}" class="category-cover" alt="${cat.title}">
                    <div class="app-info">
                        <div class="app-title">${cat.title}</div>
                        <div class="app-price">تصفح الآن</div>
                    </div>
                `;
                grid.appendChild(card);
            }
        }

        window.openCategory = (categoryKey) => {
            const category = storeData[categoryKey];
            if(!category) return;

            document.getElementById('view-home').classList.remove('active');
            document.getElementById('view-category').classList.add('active');
            document.getElementById('category-title').innerText = category.title;

            const container = document.getElementById('category-items');
            container.innerHTML = '';

            // فلترة المنتجات حسب القسم
            const filtered = dynamicProducts.filter(p => p.categoryId === categoryKey);

            if(filtered.length === 0) {
                container.innerHTML = '<div class="col-span-full text-center py-10 text-slate-500">لا توجد تطبيقات في هذا القسم حالياً. أضف من لوحة التحكم.</div>';
            }

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'app-card';
                card.onclick = () => openPackages(item.id, item.name, item.img);
                card.innerHTML = `
                    <div class="bg-white">
                        <img src="${item.img}" class="app-logo-img" alt="${item.name}">
                    </div>
                    <div class="app-info">
                        <div class="app-title">${item.name}</div>
                        <div class="app-price">عرض الباقات</div>
                    </div>
                `;
                container.appendChild(card);
            });

            window.scrollTo(0, 0);
        };

        window.filterSearch = () => {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.app-card');
            cards.forEach(card => {
                const title = card.querySelector('.app-title').innerText.toLowerCase();
                card.style.display = title.includes(query) ? '' : 'none';
            });
        };

        window.openPackages = (itemId, title, imgUrl) => {
            const subModal = document.getElementById('sub-modal');
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-img').src = imgUrl;
            
            const modalOptions = document.getElementById('modal-options');
            modalOptions.innerHTML = `
                <button onclick="addToCart('${itemId}-1', '${title} - باقة صغيرة', 5); closeSubMenu()" class="w-full flex justify-between items-center p-4 rounded-xl border border-slate-200 hover:border-cyan-500 transition bg-slate-50">
                    <span class="font-bold text-slate-800">باقة صغيرة</span>
                    <span class="text-cyan-600 font-black">$5</span>
                </button>
                <button onclick="addToCart('${itemId}-2', '${title} - باقة متوسطة', 10); closeSubMenu()" class="w-full flex justify-between items-center p-4 rounded-xl border border-slate-200 hover:border-cyan-500 transition bg-slate-50">
                    <span class="font-bold text-slate-800">باقة متوسطة</span>
                    <span class="text-cyan-600 font-black">$10</span>
                </button>
            `;
            subModal.classList.add('active');
        };

        window.closeSubMenu = () => document.getElementById('sub-modal').classList.remove('active');
        window.toggleCart = () => document.getElementById('cart-drawer').classList.toggle('translate-x-full');

        // السلة
        let cart = [];
        window.addToCart = (id, name, price) => {
            const existingItem = cart.find(item => item.id === id);
            if (existingItem) existingItem.qty += 1;
            else cart.push({ id, name, price, qty: 1 });
            updateCartUI();
            document.getElementById('cart-drawer').classList.remove('translate-x-full');
        };

        window.increaseQty = (id) => { const item = cart.find(i => i.id === id); if (item) { item.qty += 1; updateCartUI(); } };
        window.decreaseQty = (id) => { 
            const item = cart.find(i => i.id === id); 
            if (item) { 
                item.qty -= 1; 
                if (item.qty <= 0) cart = cart.filter(i => i.id !== id); 
                updateCartUI(); 
            } 
        };

        function updateCartUI() {
            const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            
            document.getElementById('cart-count').innerText = totalItems;
            document.getElementById('cart-total').innerText = `$${totalPrice.toFixed(3)}`;
            
            const container = document.getElementById('cart-items');
            container.innerHTML = '';
            if (cart.length === 0) {
                container.innerHTML = '<div class="text-center text-slate-500 mt-10">السلة فارغة</div>';
                return;
            }

            cart.forEach(item => {
                const div = document.createElement('div');
                div.className = 'bg-white border border-slate-200 p-4 rounded-xl flex flex-col gap-3';
                div.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div class="font-bold text-sm text-slate-800">${item.name}</div>
                        <div class="text-cyan-600 font-black">$${(item.price * item.qty).toFixed(3)}</div>
                    </div>
                    <div class="flex items-center justify-between bg-slate-50 rounded-lg p-1 border border-slate-200">
                        <button onclick="decreaseQty('${item.id}')" class="w-8 h-8 flex items-center justify-center bg-white rounded shadow-sm">-</button>
                        <span class="font-bold text-slate-800">${item.qty}</span>
                        <button onclick="increaseQty('${item.id}')" class="w-8 h-8 flex items-center justify-center bg-white rounded shadow-sm">+</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        window.checkout = () => {
            if(cart.length === 0) return alert("السلة فارغة!");
            let message = "مرحباً MARO Store،\nأريد طلب:\n\n";
            cart.forEach((item) => { message += `🔹 ${item.name} (x${item.qty}) - $${(item.price * item.qty).toFixed(3)}\n`; });
            window.open(`https://t.me/qijub?text=${encodeURIComponent(message)}`, '_blank');
        };
    </script>
